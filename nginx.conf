server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve robots.txt and sitemap.xml as real files
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /sitemap.rss {
        return 301 /sitemap.xml;
    }

    # Never cache HTML (SPA entry point)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Cache images and fonts with long TTL (these filenames are content-hashed)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JS and CSS: use ETag/Last-Modified for validation (no immutable)
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
